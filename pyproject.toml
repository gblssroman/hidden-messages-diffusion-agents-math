[project]
name = "hidden-messages-diffusion-agents-math"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dllm",
    "huggingface-hub==0.36.2",
    "lm-eval",
    "torch>=2.15.0",
    "trl==0.24.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
]

[tool.uv.sources]
dllm = { path = "code/third_party/dllm", editable = true }
lm-eval = { path = "code/third_party/dllm/lm-evaluation-harness", editable = true }
